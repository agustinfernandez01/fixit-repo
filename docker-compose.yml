services:

  # ── Base de datos ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fixit
      POSTGRES_PASSWORD: fixit123
      POSTGRES_DB: fixitdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./src
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://agustinfernandez:7x875kdQfIAFiZiAAOHHZhDWAKfD70EP@dpg-d76o5ashg0os73aab28g-a.oregon-postgres.render.com:5432/fixitdatabase?sslmode=require
      SECRET_KEY: kjWL6CjxQFfGaXhvSefuXDp0NjJF5KPlh778_Kdm8TZYPG1qCA4fPeBIHXAo_FWg
    depends_on:
      - db

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
